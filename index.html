  <style>
    :root {
      --bao-blue: #3b79c6;
      --bao-blue-dark: #2f67ad;
      --bao-ink: #304c6f;
      --bao-orange: #f6ac1c;
      --bao-green: #37965b;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: #eef7ff;
      color: var(--bao-ink);
      font-family: 'Sniglet', cursive, sans-serif;
    }

    h1, h2, h3, h4, .font-title {
      font-family: 'Fredoka', sans-serif;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .page-panel {
      display: none;
      opacity: 0;
    }
    .page-panel.is-active {
      display: block;
      animation: pageIn 350ms cubic-bezier(.22,.8,.28,1) forwards;
    }
    @keyframes pageIn { to { opacity: 1; } }

    .artboard {
      position: relative;
      width: 100%;
      max-width: 2274px;
      margin: 0 auto;
      isolation: isolate;
      background: white;
      overflow: hidden; /* Mencegah scroll ekstra kebocoran di paling bawah web */
    }
    .artboard > .source-art {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast; /* Mengoptimalkan ketajaman gambar */
    }

    /* NAVIGASI DILAKUKAN TERPISAH PER-HALAMAN DENGAN UKURAN TOMBOL UNIFORM */
    .desktop-nav {
      position: absolute;
      left: 21%;
      z-index: 30;
      width: 63%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1. Beranda */
    #home-panel .desktop-nav { 
      top: 1.85%; 
      height: 0.65%; 
    }

    /* 2. Produk */
    #products-panel .desktop-nav { 
      top: 2.10%; 
      height: 1.80%; 
    }

    /* 3. Edukasi */
    #education-panel .desktop-nav { 
      top: 4.80%; 
      height: 3.40%; 
    }

    .desktop-nav__links {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: space-around;
    }

    .nav-control {
      height: 88%;
      padding: 0 7%;
      border: 0;
      border-radius: 999px;
      color: #355474;
      background: transparent;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: clamp(.75rem, 1.25vw, 1.45rem); /* Di-gedein sedikit agar lebih jelas */
      cursor: pointer;
      transition: all 180ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-control:hover {
      color: var(--bao-blue-dark);
      background: rgba(220, 237, 255, .8);
    }

    .nav-control.is-active {
      color: white;
      background: var(--bao-blue);
      box-shadow: 0 .25em .7em rgba(47, 103, 173, .26);
    }

    /* BERANDA OVERLAYS */

      position: absolute;
      left: 58.8%;
      top: 64.9%;
      width: 13.8%;
      height: 1.1%;
      z-index: 25;
      background: var(--bao-blue);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(.6rem, 1.1vw, 1.4rem);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(59, 121, 200, 0.4);
      transition: all 200ms ease;

    .btn-pesan-sekarang:hover {
      background: var(--bao-blue-dark);

      top: 38%;
      width: 78%;

      display: flex;
      align-items: center;
      justify-content: center;

    .education-hotspot {
      position: absolute;
      z-index: 22;
      border: 0;
      border-radius: 28px;
      background: transparent;
      cursor: pointer;
      transition: all 200ms ease;

    .education-hotspot--article { left: 54%; top: 25%; width: 30%; height: 38%; }

      box-shadow: 0 0 0 5px rgba(255,255,255,.7);
    }

    /* OVERLAY FOOTER SOSIAL MEDIA & NEWSLETTER */
    .social-footer-overlay {
      position: absolute;
      left: 2%;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: clamp(6px, 1vw, 16px);

    #products-panel .social-footer-overlay { top: 92.0%; }
    #education-panel .social-footer-overlay { top: 85.0%; }

    .social-icon-btn {
      width: clamp(28px, 2.2vw, 44px);
      height: clamp(28px, 2.2vw, 44px);
      border-radius: 50%;
      background: #f0f7ff;
      border: 1.5px solid var(--bao-blue);
      color: var(--bao-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 200ms ease;
    }
    .social-icon-btn:hover {
      background: var(--bao-blue);
      color: white;
      transform: translateY(-2px);
    }

    .newsletter-footer-overlay {
      position: absolute;
      right: 4%;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    #home-panel .newsletter-footer-overlay { top: 95.0%; }
    #products-panel .newsletter-footer-overlay { top: 90.5%; }
    #education-panel .newsletter-footer-overlay { top: 82.5%; }

    .newsletter-custom-box input {
      border: 2px solid var(--bao-blue);
      border-radius: 12px 0 0 12px;
      padding: clamp(4px, .5vw, 8px) clamp(8px, 1vw, 14px);
      outline: none;
      font-size: clamp(.6rem, .9vw, 1rem);
      font-family: 'Sniglet', cursive;
      width: clamp(140px, 14vw, 260px);

    .newsletter-custom-box button {
      background: var(--bao-blue);
      color: white;
      border: 2px solid var(--bao-blue);
      border-radius: 0 12px 12px 0;
      padding: clamp(4px, .5vw, 8px) clamp(10px, 1.2vw, 18px);
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: clamp(.6rem, .9vw, 1rem);
      cursor: pointer;

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 22px;
      opacity: 0;
      visibility: hidden;
      background: rgba(27, 51, 80, .62);
      backdrop-filter: blur(8px);

    .modal-backdrop.is-open { opacity: 1; visibility: visible; }

      background: #fff8e8;

  <script>
    function setRoute(routeName) {
      document.querySelectorAll('.page-panel').forEach(panel => {
        panel.classList.remove('is-active');
      });

      const targetPanel = document.getElementById(`${routeName}-panel`);
      if (targetPanel) {
        targetPanel.classList.add('is-active');
      }

      document.querySelectorAll('.nav-control').forEach(btn => {
        btn.classList.remove('is-active');
        if (btn.dataset.route === routeName) {
          btn.classList.add('is-active');
        }
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('[data-route]').forEach(btn => {
      btn.addEventListener('click', () => setRoute(btn.dataset.route));
    });

    function openModal() {
      document.getElementById('coming-soon-modal').classList.add('is-open');
    }
    function closeModal() {
      document.getElementById('coming-soon-modal').classList.remove('is-open');
    }

    function handleSubscribe(event) {
      event.preventDefault();
      alert(`Terima kasih! Surel Anda telah terdaftar dalam sistem edukasi BAOBAO.`);
    }
  </script>
